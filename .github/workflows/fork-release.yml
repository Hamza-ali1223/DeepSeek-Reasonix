name: Fork release (Windows and Linux)

# Unsigned fork builds: the CLI for Windows and Linux, plus the Studio installer,
# portable zip and Linux packages for the supported architectures.
#
# Deliberately not wired to upstream's release machinery:
#   - tags are `fork-v*` so this can never fire on upstream's `studio-v*` / `v*`;
#   - no Apple, Certum, npm, Homebrew or R2 credentials are read, so the build
#     needs no secrets at all;
#   - the app's own updater cannot adopt a fork release: its catalog and
#     minisign key are pinned to dl.reasonix.io in internal/platform/update.
#
# fork-auto-release.yml tags every push to studio and dispatches this workflow.

on:
  push:
    tags: ["fork-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing fork-v* tag to build and publish
        required: true

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-cli:
    name: CLI (windows)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Windows binaries
        shell: bash
        run: |
          set -euo pipefail
          # Same derivation the Studio job validates; a tag this cannot read is
          # refused here rather than producing a CLI whose version is nonsense.
          [[ "$TAG" =~ ^fork-v(.+)$ ]] || { echo "::error::fork release tag must be fork-v<version>, got: $TAG"; exit 1; }
          version="${BASH_REMATCH[1]}"
          commit="$(git rev-parse --short=12 HEAD)"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.version=${version} -X main.gitCommit=${commit} -X main.buildTimeUTC=${built}"
          mkdir -p dist
          for arch in amd64 arm64; do
            echo "building windows/${arch}"
            CGO_ENABLED=0 GOOS=windows GOARCH="${arch}" go build -trimpath \
              -ldflags "${ldflags}" \
              -o "dist/reasonix-windows-${arch}.exe" ./cmd/reasonix
          done

      - uses: actions/upload-artifact@v4
        with:
          name: fork-cli-windows
          path: dist/*.exe
          if-no-files-found: error

  linux-cli:
    name: CLI (linux)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend-next/pnpm-lock.yaml

      - name: Build the web app
        working-directory: desktop/frontend-next
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^fork-v(.+)$ ]] || { echo "::error::fork release tag must be fork-v<version>, got: $TAG"; exit 1; }
          version="${BASH_REMATCH[1]}"
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          [[ "$version" =~ $semver ]] || { echo "::error::invalid fork release version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Linux CLI binaries
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short=12 HEAD)"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.version=${VERSION} -X main.gitCommit=${commit} -X main.buildTimeUTC=${built}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "$ldflags" -o "dist/reasonix-linux-${arch}" ./cmd/reasonix
            actual_machine="$(readelf -h "dist/reasonix-linux-${arch}" | awk -F: '/Machine:/ { gsub(/^[[:space:]]+/, "", $2); print $2 }')"
            expected_machine="Advanced Micro Devices X86-64"
            [ "$arch" = arm64 ] && expected_machine="AArch64"
            [ "$actual_machine" = "$expected_machine" ] || {
              echo "::error::reasonix-linux-${arch} is ${actual_machine}, expected ${expected_machine}"
              exit 1
            }
            bash scripts/package-cli-archive.sh linux "$arch" \
              "dist/reasonix-linux-${arch}" desktop/frontend-next/dist dist
            tar -tzf "dist/reasonix-linux-${arch}.tar.gz" | grep -qx 'reasonix'
            tar -tzf "dist/reasonix-linux-${arch}.tar.gz" | grep -qx 'frontend-next/dist/index.html'
            rm "dist/reasonix-linux-${arch}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: fork-cli-linux
          path: dist/reasonix-linux-*.tar.gz
          if-no-files-found: error

  windows-studio:
    name: Studio (windows/amd64)
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # Real-time scanning inspects every byte packaging writes, and this job
      # writes a quarter of a gigabyte twice. The runner is discarded afterwards.
      - name: Stop Defender scanning the build
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # pnpm 10 is what the lockfiles are written against; pnpm 11 refuses them
      # and asks to purge the modules directory, which a non-interactive runner
      # cannot answer.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            desktop/frontend-next/pnpm-lock.yaml
            desktop/electron/pnpm-lock.yaml

      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          # electron-builder states the version in the Windows executable's
          # resource block, where a major number that is not a number is refused
          # ("Invalid major number"). Validating here costs a second; discovering
          # it in `Build the bundle` costs the whole SPA and kernel build.
          [[ "$TAG" =~ ^fork-v(.+)$ ]] || { echo "::error::fork release tag must be fork-v<version>, got: $TAG"; exit 1; }
          version="${BASH_REMATCH[1]}"
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          [[ "$version" =~ $semver ]] || { echo "::error::version '$version' is not MAJOR.MINOR.PATCH[-PRERELEASE]; a leading dot, a missing digit, or '+build' metadata stops electron-builder"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "building Studio ${version}"

      - name: Build the SPA
        working-directory: desktop/frontend-next
        shell: bash
        run: pnpm install --frozen-lockfile && pnpm build

      # Builds the kernel this shell spawns and stages the pinned CUA Driver.
      # The version is injected here as well as into the Electron metadata: the
      # kernel names a release when it installs one on another machine.
      - name: Build the kernel
        working-directory: desktop/electron
        shell: bash
        env:
          REASONIX_VERSION: ${{ steps.v.outputs.version }}
          REASONIX_GOARCH: amd64
        run: pnpm install --frozen-lockfile && pnpm run build:host

      - name: Build the bundle
        working-directory: desktop/electron
        shell: bash
        # --publish never: electron-builder also publishes implicitly when it
        # finds a git tag, which would have this job upload a second time and
        # from a runner that is not the one the release is assembled on.
        run: pnpm exec electron-builder --dir --publish never -c.extraMetadata.version="${{ steps.v.outputs.version }}"

      # An emulated x64 program runs on ARM64 Windows, so a bundle that starts
      # proves nothing about its architecture; every PE image must match.
      - name: Every PE image is built for amd64
        shell: bash
        run: node desktop/electron/packaging/pe.js "dist/win-unpacked" amd64

      - name: Package installer and portable zip
        working-directory: desktop/electron
        shell: bash
        run: pnpm exec electron-builder --win --x64 --publish never -c.extraMetadata.version="${{ steps.v.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: fork-studio-windows
          path: |
            dist/ReasonixStudio-windows-amd64-installer.exe
            dist/ReasonixStudio-windows-amd64.zip
          if-no-files-found: error

  linux-studio:
    name: Studio (linux/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      ARCH: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            ebarch: x64
          - arch: arm64
            runner: ubuntu-22.04-arm
            ebarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            desktop/frontend-next/pnpm-lock.yaml
            desktop/electron/pnpm-lock.yaml

      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^fork-v(.+)$ ]] || { echo "::error::fork release tag must be fork-v<version>, got: $TAG"; exit 1; }
          version="${BASH_REMATCH[1]}"
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          [[ "$version" =~ $semver ]] || { echo "::error::invalid fork release version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Linux packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm cpio xvfb xauth policykit-1

      - name: Install native fpm on ARM64
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm -v 1.16.0
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      - name: Build the SPA
        working-directory: desktop/frontend-next
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Build the kernel and package payload
        working-directory: desktop/electron
        env:
          REASONIX_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          REASONIX_GOARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#fork-v}"
          REASONIX_VERSION="$version" pnpm install --frozen-lockfile
          REASONIX_VERSION="$version" pnpm run build:host
          pnpm run build:linux-payload

      - name: Build and package Linux Studio
        working-directory: desktop/electron
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^fork-v(.+)$ ]] || { echo "::error::fork release tag must be fork-v<version>, got: $TAG"; exit 1; }
          version="${BASH_REMATCH[1]}"
          pnpm exec electron-builder --dir --publish never --${{ matrix.ebarch }} \
            -c.extraMetadata.version="$version"
          pnpm exec electron-builder --prepackaged "../../dist/linux-unpacked" \
            --linux deb rpm AppImage --publish never --${{ matrix.ebarch }} \
            -c.extraMetadata.version="$version"

      - name: Verify Linux packages
        shell: bash
        run: |
          bash scripts/verify-linux-package.sh \
            "dist/ReasonixStudio-linux-${ARCH}.deb" \
            "dist/ReasonixStudio-linux-${ARCH}.rpm" "$ARCH"
          bash scripts/verify-linux-appimage.sh \
            "dist/ReasonixStudio-linux-${ARCH}.AppImage" "$ARCH"
          bash scripts/linux-install-smoke.sh \
            "dist/ReasonixStudio-linux-${ARCH}.deb" "$ARCH" "${TAG#fork-v}"

      - uses: actions/upload-artifact@v4
        with:
          name: fork-studio-linux-${{ matrix.arch }}
          path: |
            dist/ReasonixStudio-linux-${{ matrix.arch }}.deb
            dist/ReasonixStudio-linux-${{ matrix.arch }}.rpm
            dist/ReasonixStudio-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  publish:
    name: Publish
    needs: [windows-cli, linux-cli, windows-studio, linux-studio]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # Build and verify the complete release inventory before publishing. Each
      # name is explicit so a missing package or unexpected extra cannot pass.
      - name: Verify artifacts and write combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          expected=(
            reasonix-windows-amd64.exe
            reasonix-windows-arm64.exe
            reasonix-linux-amd64.tar.gz
            reasonix-linux-arm64.tar.gz
            ReasonixStudio-windows-amd64-installer.exe
            ReasonixStudio-windows-amd64.zip
            ReasonixStudio-linux-amd64.deb
            ReasonixStudio-linux-amd64.rpm
            ReasonixStudio-linux-amd64.AppImage
            ReasonixStudio-linux-arm64.deb
            ReasonixStudio-linux-arm64.rpm
            ReasonixStudio-linux-arm64.AppImage
          )
          for file in "${expected[@]}"; do
            test -s "$file" || { echo "::error::missing or empty release asset: $file"; exit 1; }
          done
          actual_count="$(find . -maxdepth 1 -type f ! -name SHA256SUMS | wc -l)"
          test "$actual_count" -eq "${#expected[@]}" || {
            echo "::error::expected ${#expected[@]} release assets, found $actual_count"
            find . -maxdepth 1 -type f -printf '%f\\n' | sort
            exit 1
          }
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Fork ${{ env.TAG }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: |
            assets/reasonix-windows-amd64.exe
            assets/reasonix-windows-arm64.exe
            assets/reasonix-linux-amd64.tar.gz
            assets/reasonix-linux-arm64.tar.gz
            assets/ReasonixStudio-windows-amd64-installer.exe
            assets/ReasonixStudio-windows-amd64.zip
            assets/ReasonixStudio-linux-amd64.deb
            assets/ReasonixStudio-linux-amd64.rpm
            assets/ReasonixStudio-linux-amd64.AppImage
            assets/ReasonixStudio-linux-arm64.deb
            assets/ReasonixStudio-linux-arm64.rpm
            assets/ReasonixStudio-linux-arm64.AppImage
            assets/SHA256SUMS
