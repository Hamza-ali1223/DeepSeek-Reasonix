name: Fork release (Windows and Linux)

# Fork builds: the CLI for Windows and Linux, plus the Studio installer,
# portable zip and Linux packages for the supported architectures.
#
# Deliberately not wired to upstream's release machinery:
#   - tags are `fork-v*` so this can never fire on upstream's `studio-v*` / `v*`;
#   - no Apple, Certum, npm, Homebrew or R2 credentials are read;
#   - the Studio updater signs only the Windows amd64 installer and Linux amd64
#     Debian package with dedicated fork Minisign secrets.
#
# fork-auto-release.yml tags every push to studio and dispatches this workflow.

on:
  push:
    tags: ["fork-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing fork-v* tag to build and publish
        required: true

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-cli:
    name: CLI (windows)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Windows binaries
        shell: bash
        run: |
          set -euo pipefail
          # Same derivation the Studio job validates; a tag this cannot read is
          # refused here rather than producing a CLI whose version is nonsense.
          [[ "$TAG" =~ ^fork-v(.+)$ ]] || { echo "::error::fork release tag must be fork-v<version>, got: $TAG"; exit 1; }
          version="${BASH_REMATCH[1]}"
          commit="$(git rev-parse --short=12 HEAD)"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.version=${version} -X main.gitCommit=${commit} -X main.buildTimeUTC=${built}"
          mkdir -p dist
          for arch in amd64 arm64; do
            echo "building windows/${arch}"
            CGO_ENABLED=0 GOOS=windows GOARCH="${arch}" go build -trimpath \
              -ldflags "${ldflags}" \
              -o "dist/reasonix-windows-${arch}.exe" ./cmd/reasonix
          done

      - uses: actions/upload-artifact@v4
        with:
          name: fork-cli-windows
          path: dist/*.exe
          if-no-files-found: error

  linux-cli:
    name: CLI (linux)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend-next/pnpm-lock.yaml

      - name: Build the web app
        working-directory: desktop/frontend-next
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^fork-v(.+)$ ]] || { echo "::error::fork release tag must be fork-v<version>, got: $TAG"; exit 1; }
          version="${BASH_REMATCH[1]}"
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "$version" =~ $semver ]] || { echo "::error::invalid fork release version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Linux CLI binaries
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short=12 HEAD)"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.version=${VERSION} -X main.gitCommit=${commit} -X main.buildTimeUTC=${built}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "$ldflags" -o "dist/reasonix-linux-${arch}" ./cmd/reasonix
            actual_machine="$(readelf -h "dist/reasonix-linux-${arch}" | awk -F: '/Machine:/ { gsub(/^[[:space:]]+/, "", $2); print $2 }')"
            expected_machine="Advanced Micro Devices X86-64"
            [ "$arch" = arm64 ] && expected_machine="AArch64"
            [ "$actual_machine" = "$expected_machine" ] || {
              echo "::error::reasonix-linux-${arch} is ${actual_machine}, expected ${expected_machine}"
              exit 1
            }
            bash scripts/package-cli-archive.sh linux "$arch" \
              "dist/reasonix-linux-${arch}" desktop/frontend-next/dist dist
            archive_listing="$RUNNER_TEMP/reasonix-linux-${arch}.contents"
            tar -tzf "dist/reasonix-linux-${arch}.tar.gz" > "$archive_listing"
            grep -Fxq 'reasonix' "$archive_listing"
            grep -Fxq 'frontend-next/dist/index.html' "$archive_listing"
            rm "dist/reasonix-linux-${arch}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: fork-cli-linux
          path: dist/reasonix-linux-*.tar.gz
          if-no-files-found: error

  windows-studio:
    name: Studio (windows/amd64)
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # Real-time scanning inspects every byte packaging writes, and this job
      # writes a quarter of a gigabyte twice. The runner is discarded afterwards.
      - name: Stop Defender scanning the build
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # pnpm 10 is what the lockfiles are written against; pnpm 11 refuses them
      # and asks to purge the modules directory, which a non-interactive runner
      # cannot answer.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            desktop/frontend-next/pnpm-lock.yaml
            desktop/electron/pnpm-lock.yaml

      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          # electron-builder states the version in the Windows executable's
          # resource block, where a major number that is not a number is refused
          # ("Invalid major number"). Validating here costs a second; discovering
          # it in `Build the bundle` costs the whole SPA and kernel build.
          [[ "$TAG" =~ ^fork-v(.+)$ ]] || { echo "::error::fork release tag must be fork-v<version>, got: $TAG"; exit 1; }
          version="${BASH_REMATCH[1]}"
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "$version" =~ $semver ]] || { echo "::error::version '$version' is not a stable MAJOR.MINOR.PATCH; prerelease and build metadata tags are not published by the fork release workflow"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "building Studio ${version}"

      - name: Build the SPA
        working-directory: desktop/frontend-next
        shell: bash
        run: pnpm install --frozen-lockfile && pnpm build

      # Builds the kernel this shell spawns and stages the pinned CUA Driver.
      # The version is injected here as well as into the Electron metadata: the
      # kernel names a release when it installs one on another machine.
      - name: Build the kernel
        working-directory: desktop/electron
        shell: bash
        env:
          REASONIX_VERSION: ${{ steps.v.outputs.version }}
          REASONIX_GOARCH: amd64
        run: pnpm install --frozen-lockfile && pnpm run build:host

      - name: Build the bundle
        working-directory: desktop/electron
        shell: bash
        # --publish never: electron-builder also publishes implicitly when it
        # finds a git tag, which would have this job upload a second time and
        # from a runner that is not the one the release is assembled on.
        run: pnpm exec electron-builder --dir --publish never -c.extraMetadata.version="${{ steps.v.outputs.version }}"

      # An emulated x64 program runs on ARM64 Windows, so a bundle that starts
      # proves nothing about its architecture; every PE image must match.
      - name: Every PE image is built for amd64
        shell: bash
        run: node desktop/electron/packaging/pe.js "dist/win-unpacked" amd64

      - name: Package installer and portable zip
        working-directory: desktop/electron
        shell: bash
        run: pnpm exec electron-builder --win --x64 --publish never -c.extraMetadata.version="${{ steps.v.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: fork-studio-windows
          path: |
            dist/ReasonixStudio-windows-amd64-installer.exe
            dist/ReasonixStudio-windows-amd64.zip
          if-no-files-found: error

  linux-studio:
    name: Studio (linux/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      ARCH: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            ebarch: x64
            unpacked_dir: linux-unpacked
          - arch: arm64
            runner: ubuntu-22.04-arm
            ebarch: arm64
            unpacked_dir: linux-arm64-unpacked
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            desktop/frontend-next/pnpm-lock.yaml
            desktop/electron/pnpm-lock.yaml

      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^fork-v(.+)$ ]] || { echo "::error::fork release tag must be fork-v<version>, got: $TAG"; exit 1; }
          version="${BASH_REMATCH[1]}"
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "$version" =~ $semver ]] || { echo "::error::invalid fork release version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Linux packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm cpio xvfb xauth policykit-1

      - name: Install native fpm on ARM64
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm -v 1.16.0
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      - name: Build the SPA
        working-directory: desktop/frontend-next
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Build the kernel and package payload
        working-directory: desktop/electron
        env:
          REASONIX_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          REASONIX_GOARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#fork-v}"
          REASONIX_VERSION="$version" pnpm install --frozen-lockfile
          REASONIX_VERSION="$version" pnpm run build:host
          pnpm run build:linux-payload

      - name: Build and package Linux Studio
        working-directory: desktop/electron
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^fork-v(.+)$ ]] || { echo "::error::fork release tag must be fork-v<version>, got: $TAG"; exit 1; }
          version="${BASH_REMATCH[1]}"
          pnpm exec electron-builder --dir --publish never --${{ matrix.ebarch }} \
            -c.extraMetadata.version="$version"
          pnpm exec electron-builder --prepackaged "../../dist/${{ matrix.unpacked_dir }}" \
            --linux deb rpm AppImage --publish never --${{ matrix.ebarch }} \
            -c.extraMetadata.version="$version"

      - name: Verify Linux packages
        shell: bash
        run: |
          bash scripts/verify-linux-package.sh \
            "dist/ReasonixStudio-linux-${ARCH}.deb" \
            "dist/ReasonixStudio-linux-${ARCH}.rpm" "$ARCH"
          bash scripts/verify-linux-appimage.sh \
            "dist/ReasonixStudio-linux-${ARCH}.AppImage" "$ARCH"
          bash scripts/linux-install-smoke.sh \
            "dist/ReasonixStudio-linux-${ARCH}.deb" "$ARCH" "${TAG#fork-v}"

      - uses: actions/upload-artifact@v4
        with:
          name: fork-studio-linux-${{ matrix.arch }}
          path: |
            dist/ReasonixStudio-linux-${{ matrix.arch }}.deb
            dist/ReasonixStudio-linux-${{ matrix.arch }}.rpm
            dist/ReasonixStudio-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  publish:
    name: Publish
    needs: [windows-cli, linux-cli, windows-studio, linux-studio]
    runs-on: ubuntu-latest
    concurrency:
      group: fork-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # Build and verify the complete release inventory before publishing. Each
      # name is explicit so a missing package or unexpected extra cannot pass.
      - name: Verify artifacts and write combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          expected=(
            reasonix-windows-amd64.exe
            reasonix-windows-arm64.exe
            reasonix-linux-amd64.tar.gz
            reasonix-linux-arm64.tar.gz
            ReasonixStudio-windows-amd64-installer.exe
            ReasonixStudio-windows-amd64.zip
            ReasonixStudio-linux-amd64.deb
            ReasonixStudio-linux-amd64.rpm
            ReasonixStudio-linux-amd64.AppImage
            ReasonixStudio-linux-arm64.deb
            ReasonixStudio-linux-arm64.rpm
            ReasonixStudio-linux-arm64.AppImage
          )
          for file in "${expected[@]}"; do
            test -s "$file" || { echo "::error::missing or empty release asset: $file"; exit 1; }
          done
          actual_count="$(find . -maxdepth 1 -type f ! -name SHA256SUMS | wc -l)"
          test "$actual_count" -eq "${#expected[@]}" || {
            echo "::error::expected ${#expected[@]} release assets, found $actual_count"
            find . -maxdepth 1 -type f -printf '%f\\n' | sort
            exit 1
          }
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Refuse to replace a published release
        shell: bash
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>"$error_file"; then
            echo "::error::release $TAG already exists; published release assets are immutable"
            exit 1
          elif ! grep -Eqi 'release not found|HTTP 404' "$error_file"; then
            cat "$error_file" >&2
            echo "::error::could not determine whether $TAG already has a release"
            exit 1
          fi
          rm -f "$error_file"

      - name: Sign updater packages
        working-directory: desktop
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.FORK_STUDIO_MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.FORK_STUDIO_MINISIGN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$MINISIGN_PRIVATE_KEY" && -n "$MINISIGN_PASSWORD" ]] || {
            echo "::error::fork Studio Minisign Actions secrets are missing"
            exit 1
          }
          go run ./cmd/sign sign \
            ../assets/ReasonixStudio-windows-amd64-installer.exe \
            ../assets/ReasonixStudio-linux-amd64.deb
          go run ./cmd/sign verify ../assets/ReasonixStudio-windows-amd64-installer.exe
          go run ./cmd/sign verify ../assets/ReasonixStudio-linux-amd64.deb

      - name: Generate the per-release updater manifest
        working-directory: desktop
        env:
          VERSION: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HAS_R2: "false"
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#fork-v}"
          mkdir -p ../assets/updater
          cp ../assets/ReasonixStudio-windows-amd64-installer.exe ../assets/updater/
          cp ../assets/ReasonixStudio-linux-amd64.deb ../assets/updater/
          go run ./cmd/studio-manifest ../assets/updater "$version" "$TAG"
          mv ../assets/updater/latest.json ../assets/latest.json

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          args=(-f "tag_name=$TAG")
          args+=(-f "previous_tag_name=$previous_tag")
          notes="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${args[@]}" --jq .body)"
          [[ -n "$notes" && "$notes" != null ]] || { echo "::error::GitHub returned empty release notes"; exit 1; }
          printf '%s\n' "$notes" > assets/release-notes.txt
          iconv -f UTF-8 -t UTF-8 assets/release-notes.txt >/dev/null
          test -s assets/release-notes.txt
          test "$(wc -c < assets/release-notes.txt)" -le 262144 || {
            echo "::error::release notes exceed the updater's 256 KiB limit"
            exit 1
          }

      - name: Carry forward the signed rollback catalog
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#fork-v}"
          [[ "$TAG" =~ ^fork-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::only stable fork-vMAJOR.MINOR.PATCH releases enter the Studio update catalog"
            exit 1
          }
          mkdir -p previous-catalog
          previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          current_release_version="${previous_tag#fork-v}"
          [[ "$previous_tag" == fork-v* && "$current_release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::the current latest release is not a stable fork tag; refusing to promote out of order"
            exit 1
          }
          newest_release="$(printf '%s\n%s\n' "$current_release_version" "$version" | sort -V | tail -n 1)"
          [[ "$newest_release" == "$version" && "$current_release_version" != "$version" ]] || {
            echo "::error::${TAG} is not strictly newer than the current latest release ${previous_tag}"
            exit 1
          }
          if [[ -n "$previous_tag" ]]; then
            previous_assets="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${previous_tag}" --jq '[.assets[].name] | .[]')"
            if grep -Fxq studio-versions.json <<<"$previous_assets"; then
              gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern studio-versions.json --dir previous-catalog
              previous_version="${previous_tag#fork-v}"
              jq -e --arg repo "$GITHUB_REPOSITORY" --arg version "$previous_version" --arg tag "$previous_tag" '(.schemaVersion == 1) and (.versions | type == "array") and (.withdrawn | type == "array") and any((.versions + .withdrawn)[]; .version == $version and .tag == $tag)' previous-catalog/studio-versions.json >/dev/null || {
                echo "::error::the latest updater release is absent from its catalog; refusing to lose rollback history"
                exit 1
              }
            elif grep -Eq 'ReasonixStudio-(windows-amd64-installer\.exe|linux-amd64\.deb)\.minisig|latest\.json' <<<"$previous_assets"; then
              echo "::error::the latest updater release is missing studio-versions.json; refusing to lose rollback history"
              exit 1
            elif [[ "$previous_tag" != "fork-v4.0.2" ]]; then
              echo "::error::bootstrap is only allowed from the known pre-updater release fork-v4.0.2"
              exit 1
            fi
          fi
          if [[ ! -f previous-catalog/studio-versions.json ]]; then
            printf '{"schemaVersion":1,"versions":[],"withdrawn":[]}\n' > previous-catalog/studio-versions.json
          fi
          jq -e --arg repo "$GITHUB_REPOSITORY" '(.schemaVersion == 1) and (.versions | type == "array") and (.withdrawn | type == "array") and all((.versions + .withdrawn)[]; (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and (.tag == ("fork-v" + .version)) and (.manifest == ("https://github.com/" + $repo + "/releases/download/" + .tag + "/latest.json")) and (.notes == "release-notes.txt"))' previous-catalog/studio-versions.json >/dev/null || {
            echo "::error::existing updater catalog is invalid; refusing to replace rollback history"
            exit 1
          }
          current="$(jq -r '[.versions[]?.version] | .[]' previous-catalog/studio-versions.json | sort -V | tail -n 1)"
          if [[ -n "$current" ]]; then
            newest="$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n 1)"
            if [[ "$newest" != "$version" || "$current" == "$version" ]]; then
              echo "::error::${TAG} is not strictly newer than the latest eligible updater release ${current}"
              exit 1
            fi
          fi
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          manifest="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/latest.json"
          jq --arg version "$version" --arg tag "$TAG" --arg publishedAt "$published_at" --arg manifest "$manifest" '
            . as $old |
            {
              schemaVersion: ($old.schemaVersion // 1),
              updatedAt: $publishedAt,
              versions: ((($old.versions // []) | map(select(.version != $version))) + [{version:$version,tag:$tag,channel:"stable",publishedAt:$publishedAt,manifest:$manifest,notes:"release-notes.txt"}] | sort_by(.version | split(".") | map(tonumber)) | reverse),
              withdrawn: ($old.withdrawn // [])
            }
          ' previous-catalog/studio-versions.json > assets/studio-versions.json

      - name: Verify complete updater inventory
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            ReasonixStudio-windows-amd64-installer.exe.minisig \
            ReasonixStudio-linux-amd64.deb.minisig \
            latest.json release-notes.txt studio-versions.json; do
            test -s "assets/$file" || { echo "::error::missing updater release asset: $file"; exit 1; }
          done

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Fork ${{ env.TAG }}
          body_path: assets/release-notes.txt
          generate_release_notes: false
          draft: true
          prerelease: false
          make_latest: false
          files: |
            assets/reasonix-windows-amd64.exe
            assets/reasonix-windows-arm64.exe
            assets/reasonix-linux-amd64.tar.gz
            assets/reasonix-linux-arm64.tar.gz
            assets/ReasonixStudio-windows-amd64-installer.exe
            assets/ReasonixStudio-windows-amd64.zip
            assets/ReasonixStudio-linux-amd64.deb
            assets/ReasonixStudio-linux-amd64.rpm
            assets/ReasonixStudio-linux-amd64.AppImage
            assets/ReasonixStudio-linux-arm64.deb
            assets/ReasonixStudio-linux-arm64.rpm
            assets/ReasonixStudio-linux-arm64.AppImage
            assets/SHA256SUMS
            assets/ReasonixStudio-windows-amd64-installer.exe.minisig
            assets/ReasonixStudio-linux-amd64.deb.minisig
            assets/latest.json
            assets/release-notes.txt
            assets/studio-versions.json
          fail_on_unmatched_files: true

      - name: Verify the draft release inventory
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > release.json
          jq -e '.isDraft == true and (.assets | type == "array" and length == 18) and all(.assets[]; .state == "uploaded" and .size > 0) and ([.assets[].name] | index("ReasonixStudio-windows-amd64-installer.exe") != null) and ([.assets[].name] | index("ReasonixStudio-windows-amd64-installer.exe.minisig") != null) and ([.assets[].name] | index("ReasonixStudio-linux-amd64.deb") != null) and ([.assets[].name] | index("ReasonixStudio-linux-amd64.deb.minisig") != null) and ([.assets[].name] | index("latest.json") != null) and ([.assets[].name] | index("release-notes.txt") != null) and ([.assets[].name] | index("studio-versions.json") != null) and ([.assets[] | select(.name == "release-notes.txt")][0].contentType | startswith("text/plain") or . == "application/octet-stream")' release.json >/dev/null || {
            echo "::error::draft release is missing a required updater asset or text/plain release notes"
            exit 1
          }

      - name: Publish the completed release as latest
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
